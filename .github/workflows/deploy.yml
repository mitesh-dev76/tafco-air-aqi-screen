name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 * * * *" # hourly, shortly after CPCB's hourly update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # If CPCB is unreachable this step fails and the previous deployment stays live.
      - run: bun scripts/fetch-cpcb.js dist/cpcb.json
        env:
          CPCB_API_KEY: ${{ secrets.CPCB_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
